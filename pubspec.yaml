name: habitcoach_ai
description: HabitCoach AI - Build habits, get AI coaching, transform your life.
publish_to: 'none'
version: 1.0.2+1786178318

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Firebase (configure google-services.json / GoogleService-Info.plist)
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5
  google_sign_in: ^6.2.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # Charts
  fl_chart: ^0.70.2

  # AI / Network
  http: ^1.3.0
  google_generative_ai: ^0.4.7
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  percent_indicator: ^4.2.4
  table_calendar: ^3.2.0

  # Utils
  logger: ^2.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  path_provider: ^2.1.5
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
    - config/secrets.json

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

